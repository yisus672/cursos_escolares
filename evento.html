<section>
    <h1>Registrarte al siguiente evento.</h1>
    <p>Por favor, completa el formulario para registrarte en el evento.</p>

    <form action="/index.html" method="post">
        <fieldset>
            <legend>Registro para el evento</legend>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required><br><br>
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required><br><br>
            <label for="edad">Edad:</label>
            <input type="number" name="edad" id="edad"  required><br><br>
            <input type="submit" value="Enviar">
        </fieldset>
        <fieldset> 
            <legend> Género </legend>
            <label for="masculino">Masculino</label>
            <input type="radio" name="genero" value="masculino" id="masculino">

            <label for="femenino">Femenino</label>
            <input type="radio" name="genero" value="femenino" id="femenino">

            <input type="color">
        </fieldset>
    </form>
